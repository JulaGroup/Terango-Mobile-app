<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Cancelled - TeranGO</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #EF4444, #F87171);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
        }
        .error-icon {
            width: 80px;
            height: 80px;
            background: #EF4444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 40px;
            color: white;
        }
        h1 {
            color: #1F2937;
            margin: 0 0 16px 0;
            font-size: 28px;
        }
        .message {
            color: #6B7280;
            margin: 0 0 32px 0;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-icon">✗</div>
        <h1>Payment Cancelled</h1>
        <p class="message">Your payment was not completed. Returning to TeranGO app...</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('orderId');
        const paymentId = urlParams.get('paymentId');
        const reason = urlParams.get('reason') || 'cancelled';

        // Redirect to app immediately
        const appUrl = `teranggo://payment-cancel?orderId=${orderId || ''}&paymentId=${paymentId || ''}&status=cancelled&reason=${reason}`;

        console.log('[Cancel] Redirecting to:', appUrl);
        window.location.href = appUrl;

        // Fallback for web
        setTimeout(() => {
            if (window.location.href.startsWith('http')) {
                window.location.href = `/order-details?orderId=${orderId}`;
            }
        }, 2000);
    </script>
</body>
</html>

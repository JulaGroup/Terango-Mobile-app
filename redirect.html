<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TeranGo - Payment Success</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        background: linear-gradient(135deg, #ff6b35, #ff8f65);
        color: white;
        margin: 0;
        padding: 20px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
      }
      .container {
        max-width: 400px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 40px;
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      .success-icon {
        font-size: 64px;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 28px;
        margin-bottom: 10px;
        font-weight: 600;
      }
      p {
        font-size: 16px;
        margin-bottom: 30px;
        opacity: 0.9;
        line-height: 1.5;
      }
      .button {
        background: white;
        color: #ff6b35;
        border: none;
        padding: 15px 30px;
        border-radius: 25px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
        margin: 10px;
        transition: all 0.3s ease;
      }
      .button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
      }
      .secondary {
        background: transparent;
        color: white;
        border: 2px solid white;
      }
      .secondary:hover {
        background: white;
        color: #ff6b35;
      }
      .loading {
        display: none;
        margin-top: 20px;
      }
      .spinner {
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top: 3px solid white;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        animation: spin 1s linear infinite;
        margin: 0 auto;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="success-icon">✅</div>
      <h1>Payment Successful!</h1>
      <p>
        Your order has been placed successfully. Returning you to TeranGo...
      </p>

      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Opening TeranGo...</p>
      </div>

      <div id="buttons">
        <a href="#" class="button" id="openAppBtn">Open TeranGo</a>
        <a href="#" class="button secondary" id="downloadBtn">Get TeranGo</a>
      </div>
    </div>

    <script>
      // Get URL parameters
      const urlParams = new URLSearchParams(window.location.search);
      const orderId = urlParams.get("orderId");
      const status = urlParams.get("status");

      // App schemes for different platforms
      const appSchemes = {
        ios:
          "teranggo://payment/success" + (orderId ? `?orderId=${orderId}` : ""),
        android:
          "teranggo://payment/success" + (orderId ? `?orderId=${orderId}` : ""),
        expo:
          "exp://192.168.0.237:8081/--/payment/success" +
          (orderId ? `?orderId=${orderId}` : ""),
      };

      // Store links
      const storeLinks = {
        ios: "https://apps.apple.com/app/terango",
        android: "https://play.google.com/store/apps/terango",
      };

      function detectPlatform() {
        const userAgent = navigator.userAgent.toLowerCase();
        if (/iphone|ipad|ipod/.test(userAgent)) return "ios";
        if (/android/.test(userAgent)) return "android";
        return "web";
      }

      function openApp() {
        const platform = detectPlatform();
        const appUrl = appSchemes[platform] || appSchemes.expo;

        console.log("Opening app:", appUrl);

        // Show loading
        document.getElementById("loading").style.display = "block";
        document.getElementById("buttons").style.display = "none";

        // Try to open app
        window.location.href = appUrl;

        // Fallback after 3 seconds
        setTimeout(() => {
          document.getElementById("loading").style.display = "none";
          document.getElementById("buttons").style.display = "block";

          // Show download button
          const downloadBtn = document.getElementById("downloadBtn");
          const platform = detectPlatform();
          if (platform === "ios") {
            downloadBtn.href = storeLinks.ios;
            downloadBtn.textContent = "Download on App Store";
          } else if (platform === "android") {
            downloadBtn.href = storeLinks.android;
            downloadBtn.textContent = "Get on Google Play";
          } else {
            downloadBtn.href = "https://expo.dev/@yourusername/terango";
            downloadBtn.textContent = "Open in Expo Go";
          }
        }, 3000);
      }

      function setupButtons() {
        const openAppBtn = document.getElementById("openAppBtn");
        const downloadBtn = document.getElementById("downloadBtn");

        openAppBtn.addEventListener("click", (e) => {
          e.preventDefault();
          openApp();
        });

        downloadBtn.addEventListener("click", (e) => {
          e.preventDefault();
          const platform = detectPlatform();
          if (platform === "ios") {
            window.location.href = storeLinks.ios;
          } else if (platform === "android") {
            window.location.href = storeLinks.android;
          } else {
            // For web, try Expo Go
            window.location.href = "exp://u.expo.dev/update/your-update-id";
          }
        });
      }

      // Auto-open app after page loads
      window.addEventListener("load", () => {
        setupButtons();

        // Auto-attempt to open app after 2 seconds
        setTimeout(() => {
          if (status === "success") {
            openApp();
          }
        }, 2000);
      });

      // Handle app not opening (user stays on this page)
      window.addEventListener("blur", () => {
        // App opened successfully
        console.log("App opened successfully");
      });
    </script>
  </body>
</html>
